<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SalesStorm AI{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top" id="top-navbar">
        <div class="container-fluid">
            <!-- Sidebar Toggle (Mobile) -->
            <button class="btn btn-outline-secondary d-lg-none me-3" type="button" id="sidebar-toggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SalesStorm AI" height="32" class="me-2">
                <span class="fw-bold">SalesStorm AI</span>
            </a>
            
            <!-- Right side controls -->
            <div class="d-flex align-items-center">
                <!-- Dark Mode Toggle -->
                <button class="btn btn-outline-secondary me-3" id="theme-toggle" title="Toggle Dark/Light Mode">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
                
                <!-- User Menu -->
                <div class="dropdown">
                    <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user me-1"></i> User
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#"><i class="fas fa-cog me-2"></i>Settings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <nav class="nav flex-column">
                <a class="nav-link" href="/" data-page="dashboard">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a class="nav-link" href="/builder" data-page="builder">
                    <i class="fas fa-robot"></i>
                    <span>AI Storm Builder</span>
                </a>
                <a class="nav-link" href="/activator" data-page="activator">
                    <i class="fas fa-link"></i>
                    <span>Commission Activator</span>
                </a>
                <a class="nav-link" href="/vault" data-page="vault">
                    <i class="fas fa-gift"></i>
                    <span>Bonus Vault</span>
                </a>
                <a class="nav-link" href="/promoter" data-page="promoter">
                    <i class="fas fa-megaphone"></i>
                    <span>Promoter</span>
                </a>
                <a class="nav-link" href="/niches" data-page="niches">
                    <i class="fas fa-layers"></i>
                    <span>Niche Presets</span>
                </a>
            </nav>
        </div>
    </div>
    
    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <div class="container-fluid">
            <!-- Success/Error Messages -->
            <div id="alert-container"></div>
            
            <!-- Page Content -->
            <div id="page-content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
